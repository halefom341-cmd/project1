<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sidebar Menu -->
  <div id="sidebar" class="sidebar">
    <button class="close-btn" onclick="toggleMenu()">✕</button>
    <h2>Calculator</h2>
    <button class="menu-item" onclick="switchMode('standard', this)">📏 Standard</button>
    <button class="menu-item" onclick="switchMode('scientific', this)">🔬 Scientific</button>
    <button class="menu-item active" onclick="switchMode('graphing', this)">📈 Graphing</button>
    <button class="menu-item" onclick="switchMode('programmer', this)">💻 Programmer</button>
    <button class="menu-item" onclick="switchMode('date', this)">📅 Date calculation</button>
    <hr style="border-color: #3d3d4a; margin: 15px 0;">
    <h2>Converter</h2>
    <button class="menu-item" onclick="switchMode('currency', this)">💵 Currency</button>
    <button class="menu-item" onclick="switchMode('volume', this)">📦 Volume</button>
    <button class="menu-item" onclick="switchMode('length', this)">📏 Length</button>
    <hr style="border-color: #3d3d4a; margin: auto 0 15px 0;">
    <button class="menu-item" onclick="switchMode('settings', this)">⚙️ Settings</button>
  </div>

  <!-- Main App -->
  <div class="app-container" id="mainApp">
    <!-- Windows Title Bar -->
    <div class="title-bar">
      <div class="title-text">🧮 Calculator</div>
      <div class="window-controls">
        <button onclick="alert('Minimize is controlled by your browser/OS')">&#xE921;</button>
        <button onclick="alert('Maximize is controlled by your browser/OS')">&#xE922;</button>
        <button class="close-app" onclick="alert('Close is controlled by your browser/OS')">&#xE8BB;</button>
      </div>
    </div>

    <!-- App Header -->
    <div class="header">
      <button class="hamburger" onclick="toggleMenu()">☰</button>
      <h1 id="mode-title">Graphing</h1>
      <div class="header-icons">
        <button class="icon-btn" title="Keep on top" onclick="keepOnTop()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V4h16v4M4 16v4h16v-4M8 12h8"/></svg>
        </button>
      </div>
    </div>

    <!-- Standard Mode (Hidden) -->
    <div id="mode-standard" class="mode-content">
        <!-- ... (Standard content stays the same) ... -->
    </div>

    <!-- Scientific Mode (Hidden) -->
    <div id="mode-scientific" class="mode-content">
        <!-- ... (Scientific content stays the same) ... -->
    </div>

    <!-- Graphing Mode (Active) -->
    <div id="mode-graphing" class="mode-content active" style="padding: 0; position: relative;">
      
      <!-- Function Input Area -->
      <div class="graph-input-container">
        <span style="color:#4af626; font-family:serif; font-style:italic;">f(x) =</span>
        <input type="text" id="graph-input" value="sin(x)" oninput="drawGraph()" placeholder="e.g. x^2, sin(x)">
      </div>

      <!-- The Graph Canvas -->
      <canvas id="graphCanvas"></canvas>

      <!-- Floating Zoom Controls -->
      <div class="graph-controls">
        <button onclick="zoomGraph(1.5)">+</button>
        <button onclick="zoomGraph(0.5)">-</button>
        <button onclick="resetGraph()">◎</button>
      </div>
    </div>

    <!-- AI Chat (Hidden for graph to give full space, but can be toggled) -->
    <div class="ai-container" style="display:none;">
      <!-- ... AI Chat ... -->
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
