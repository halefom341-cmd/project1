<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <input id="display" readonly placeholder="0">
    <div class="buttons">
      <button onclick="clearDisplay()">C</button>
      <button onclick="append('%')">%</button>
      <button onclick="backspace()">?</button>
      <button onclick="append('/')">/</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('*')">*</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append('-')">-</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('+')">+</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button onclick="calculate()" class="equals">=</button>
    </div>
    <div class="ai-row">
      <input id="aiQuestion" placeholder="Ask in words, e.g. 15% of 240">
      <button onclick="askAI()">Ask AI</button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start;"><p id="aiAnswer" style="flex: 1;"></p><button onclick="clearAI()" style="background: #ff3b30; padding: 8px 12px; font-size: 14px; margin-left: 10px; box-shadow: 0 4px 0 #b3241d; display: none;" id="clearBtn">Clear</button></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
